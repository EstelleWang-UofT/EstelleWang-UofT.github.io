<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f2">
  <meta name="description" content="The personal website of Estelle Wang.">
  <title>Estelle Wang</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #242424;
      background: #f6f5f2;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; }
    main { width: min(100%, 680px); padding: clamp(2rem, 8vw, 5rem); background: #fff; border: 1px solid #e8e6e1; border-radius: 24px; box-shadow: 0 24px 70px rgb(34 31 25 / 7%); }
    .eyebrow { margin: 0 0 1.25rem; color: #77736b; font-size: .78rem; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.6rem, 10vw, 4.5rem); letter-spacing: -.065em; line-height: 1.04; }
    .intro { max-width: 38ch; margin: 1.5rem 0 0; color: #625f59; font-size: 1.1rem; line-height: 1.8; }
    nav { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2.25rem; }
    nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 1rem; border: 1px solid #dedbd4; border-radius: 999px; color: #242424; font-size: .95rem; text-decoration: none; transition: background .2s, border-color .2s; }
    nav a:hover, nav a:focus-visible { background: #f2f0eb; border-color: #bdb8ae; }
    footer { margin-top: 3.5rem; color: #8a867e; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Personal website</p>
    <h1>Hi, I'm Estelle Wang.</h1>
    <p class="intro">Welcome to my corner of the web. I'm working on adding more about myself here—please check back soon.</p>
    <nav aria-label="Social links">
      <a href="https://github.com/EstelleWang-UofT" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true"> ↗</span></a>
    </nav>
    <footer>Thanks for stopping by.</footer>
  </main>
</body>
</html>
